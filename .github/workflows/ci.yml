name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python ${{ matrix.python-version }}
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test
        run: uv run pytest
      - name: Build distributions
        run: uv build
      - name: Install built wheel
        run: |
          python -m venv "$RUNNER_TEMP/package-venv"
          shopt -s nullglob
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          "$RUNNER_TEMP/package-venv/bin/python" -m pip install "${wheels[0]}" -r examples/entitylinkage-coverage/requirements.txt
          export PATH="$RUNNER_TEMP/package-venv/bin:$PATH"
          cd "$RUNNER_TEMP"
          python -c 'import evidencematrix, pathlib; assert "site-packages" in pathlib.Path(evidencematrix.__file__).resolve().parts'
          evidencematrix validate "$GITHUB_WORKSPACE/examples/basic"
          bash "$GITHUB_WORKSPACE/examples/entitylinkage-coverage/run-example.sh" "$RUNNER_TEMP/entitylinkage-coverage-example"
      - name: CLI smoke test
        shell: bash
        run: |
          uv run evidencematrix validate examples/basic
          uv run evidencematrix build examples/basic --output "$RUNNER_TEMP/evidencematrix-out"
          uv run evidencematrix summary examples/basic --format json > "$RUNNER_TEMP/summary.json"
          python -c 'import json, os, pathlib; data=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"], "summary.json").read_text()); assert data["relationship_count"] == 12'
          set +e
          uv run evidencematrix audit examples/basic --format json > "$RUNNER_TEMP/audit.json"
          audit_status=$?
          set -e
          test "$audit_status" -eq 1
