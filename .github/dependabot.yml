version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: "/examples/entitylinkage-coverage"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
